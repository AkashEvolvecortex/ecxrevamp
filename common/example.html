<!-- Example: reuse sections from common.html on any page -->
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="../common/common.css" rel="stylesheet">

<div class="alignfull">

  <!-- Hero with an IMAGE background -->
  <div data-include="hero video-modal"
       data-bg-image="https://evolvecortex.com/ecxrevamp/images/services/banneradvisory.webp"></div>

  <!-- Or a VIDEO background (default video if data-bg-video is left out):
  <div data-include="hero video-modal"
       data-bg-video="https://evolvecortex.com/ecxrevamp/videos/xeye360-hero.webm"
       data-bg-poster="https://evolvecortex.com/ecxrevamp/images/posterbanner.jpg"></div>
  -->

  <!-- Page-specific content stays here as normal -->
  <section class="section">
    <div class="container-xl">
      <h2 class="section-title">My page content</h2>
    </div>
  </section>

  <!-- Reused sections (names = data-section in common.html) -->
  <div data-include="stats"></div>
  <div data-include="faq"></div>
  <div data-include="cta other-solutions"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../common/common.js"></script>
